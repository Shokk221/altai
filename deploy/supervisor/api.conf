# api — Fastify. Veritabanına yazan TEK süreç.
#
# Sırlar buraya YAZILMAZ: bu dosya git'te. Ortam değişkenleri /app/.env'den
# gelir (gitignore'da, host diskinde kalıcı). DATABASE_URL'i oraya KOYMAYIN —
# konteyner onu zaten ortamda veriyor ve supervisord alt süreçlere aktarıyor.

[program:api]
command=/app/apps/api/node_modules/.bin/tsx --env-file-if-exists=/app/.env src/index.ts
directory=/app/apps/api

autostart=true
autorestart=true
# Süreç 5 saniye ayakta kalmadan çıkarsa "başlatılamadı" sayılır — açılışta
# patlayan bir config hatası sonsuz restart döngüsüne dönüşmesin.
startsecs=5
startretries=3

# Kapanış: api'nin bekleyen raw_events batch'ini boşaltması gerekiyor.
# SIGTERM'i kendi işliyor (apps/api/src/index.ts); 30 sn'ye kadar bekle.
stopsignal=TERM
stopwaitsecs=30

# web ve bot api'ye bağımlı — önce bu ayağa kalksın.
priority=10

environment=NODE_ENV="production",PORT="3001"

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
