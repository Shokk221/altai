# web — Next.js (App Router), üretim modunda.
#
# DİKKAT: `next start` ÖNCEDEN build edilmiş çıktıyı sunar. Yeni kod çektikten
# sonra `deploy/deploy.sh` çalıştırmadan restart etmek eski arayüzü sunmaya
# devam eder — sessiz ve kafa karıştırıcı bir hata.
#
# Ayrıca NEXT_PUBLIC_* değişkenleri BUILD ANINDA gömülür, çalışma anında değil.
# Bu yüzden deploy.sh build'i /app/.env yüklenmiş hâlde çalıştırır.

[program:web]
command=/app/apps/web/node_modules/.bin/next start -p 3000
directory=/app/apps/web

autostart=true
autorestart=true
startsecs=5
startretries=3

stopsignal=TERM
stopwaitsecs=15

priority=20

environment=NODE_ENV="production",PORT="3000"

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
