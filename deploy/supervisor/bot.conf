# bot — Discord botu. Hiçbir port dinlemez, yalnızca dışarı bağlanır.
#
# DISCORD_BOT_TOKEN yoksa bot 0 ile çıkar (bağlanacak bir şey olmadan
# event loop'u meşgul tutmanın anlamı yok). Bu bir hata DEĞİL, o yüzden:
#   exitcodes=0 + autorestart=unexpected -> 0 ile çıkış "beklenen" sayılır,
#     supervisord yeniden başlatmaya çalışmaz, durum EXITED olur (FATAL değil)
#   startsecs=0 -> "çok hızlı çıktı" diye başlangıç hatası sayılmaz
# Gerçek bir çökme (sıfır olmayan kod) yine yeniden başlatılır.
#
# Token eklendikten sonra: supervisorctl restart bot -> RUNNING olmalı.

[program:bot]
command=/app/apps/bot/node_modules/.bin/tsx --env-file-if-exists=/app/.env src/index.ts
directory=/app/apps/bot

autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3

stopsignal=TERM
stopwaitsecs=15

priority=30

environment=NODE_ENV="production"

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
