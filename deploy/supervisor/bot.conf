# bot — Discord botu. Hiçbir port dinlemez, yalnızca dışarı bağlanır.
#
# DISCORD_BOT_TOKEN yoksa bot bağlanmadan bekler (apps/bot/src/index.ts),
# çökmez. Yani token doldurulmadan da supervisord "running" gösterir —
# gerçekten bağlandığını `supervisorctl tail bot` ile doğrulayın.

[program:bot]
command=/app/apps/bot/node_modules/.bin/tsx --env-file-if-exists=/app/.env src/index.ts
directory=/app/apps/bot

autostart=true
autorestart=true
startsecs=5
startretries=3

stopsignal=TERM
stopwaitsecs=15

priority=30

environment=NODE_ENV="production"

stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
