name: CI

# Dal `master`: önce `main` yazıyordu ve depoda öyle bir dal yok, push'larda
# CI hiç çalışmıyordu.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sürüm package.json'daki `packageManager` alanından okunuyor. Burada
      # ayrıca `version` verilince action-setup@v4 "birden fazla sürüm"
      # hatasıyla ilk adımda düşüyordu; CI bu yüzden hiç koşmamıştı.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
